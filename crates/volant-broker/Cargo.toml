[package]
name = "volant-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Broker logic: topics, partitions, producers, consumers"

[features]
default = []
# Optional inter-broker TLS (rustls). Enabled by volant-server `--features tls`.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
volant-core = { workspace = true }
volant-protocol = { workspace = true }
volant-storage = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
crc32c = "0.6"
# RecordBatch compression (Phase 28)
flate2 = "1"
snap = "1"
lz4_flex = { version = "0.11", default-features = true }
zstd = "0.13"
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
uuid = { workspace = true }
volant-client = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
