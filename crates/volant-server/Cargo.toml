[package]
name = "volant-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Volant broker server binary"

[[bin]]
name = "volant-server"
path = "src/main.rs"

[features]
default = []
# Optional thread-per-core / CPU affinity mode (see VOLANT_CPU_LIST, docs/tuning.md).
thread-per-core = ["dep:core_affinity"]
# Optional TLS (rustls). Default build stays free of rustls for broad macOS/CI green.
# Also enables inter-broker TLS in volant-broker when client TLS is active.
tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:x509-parser",
    "volant-broker/tls",
]

[dependencies]
volant-core = { workspace = true }
volant-broker = { workspace = true }
volant-protocol = { workspace = true }
volant-storage = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
core_affinity = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }
x509-parser = { version = "0.16", optional = true }
