[package]
name = "volant-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Volant broker server binary"

[[bin]]
name = "volant-server"
path = "src/main.rs"

[features]
default = []
# Optional thread-per-core / CPU affinity mode (see VOLANT_CPU_LIST, docs/tuning.md).
thread-per-core = ["dep:core_affinity"]

[dependencies]
volant-core = { workspace = true }
volant-broker = { workspace = true }
volant-protocol = { workspace = true }
volant-storage = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
core_affinity = { version = "0.8", optional = true }
