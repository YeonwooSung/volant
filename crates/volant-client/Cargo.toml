[package]
name = "volant-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async client SDK for producing and consuming Volant topics"

[features]
default = []
# Optional TLS (rustls + webpki-roots). Pair with volant-server `--features tls`.
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
volant-core = { workspace = true }
volant-protocol = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
volant-broker = { workspace = true }
volant-storage = { workspace = true }
uuid = { workspace = true }
