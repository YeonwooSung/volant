# Phase 112 — workspace tests + deterministic fuzz corpus smoke (MVP).
# No multi-hour fuzz campaigns; no cargo-fuzz required on CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test + corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--all-targets` covers lib/bin/integration/unit; skips doctests (less flaky).
      - name: Workspace tests
        run: cargo test --workspace --all-targets --no-fail-fast

      # Explicit label for the Phase 112 / v0.15 deterministic seed replay (also covered above).
      - name: Protocol fuzz corpus smoke
        run: cargo test -p volant-protocol corpus_smoke -- --nocapture

  # Optional only: not on push/PR. Default CI time is unchanged.
  fuzz-nightly:
    name: optional cargo-fuzz (workflow_dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Capped long fuzz (not default CI)
        env:
          FUZZ_LONG_SECS: "30"
        run: ./scripts/fuzz_corpus_smoke.sh long
