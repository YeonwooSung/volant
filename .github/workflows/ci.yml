# Phase 112 — workspace tests + deterministic fuzz corpus smoke (MVP).
# No multi-hour fuzz campaigns; no cargo-fuzz required on CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test + corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--all-targets` covers lib/bin/integration/unit; skips doctests (less flaky).
      - name: Workspace tests
        run: cargo test --workspace --all-targets --no-fail-fast

      # Explicit label for the Phase 112 deterministic seed replay (also covered above).
      - name: Protocol fuzz corpus smoke
        run: cargo test -p volant-protocol corpus_smoke -- --nocapture
