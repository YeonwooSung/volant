[project]
name = "volant"
version = "0.2.0"
description = "Native Volant protocol client (sync TCP MVP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
