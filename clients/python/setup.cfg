[metadata]
name = volant
version = 0.2.0
description = Native Volant protocol client (sync TCP MVP)
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7
