# Single-node Deployment replicas (ignored when cluster.enabled).
replicaCount: 1

image:
  repository: volant
  tag: "0.2.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9092
  metricsPort: 9102

# Shared-token auth (leave empty to disable). Prefer a Secret in production.
authToken: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

metrics:
  enabled: true

logFormat: json

# Extra args appended to the server command.
extraArgs: []

# Multi-node static cluster (Phase 9). When enabled, deploys a StatefulSet
# with a headless Service and ConfigMap-mounted cluster.toml.
# node-id = StatefulSet ordinal + 1.
cluster:
  enabled: false
  replicas: 3
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  sessionTimeoutMs: 3000
  replicaFetchMaxWaitMs: 500
  replicaFetchMaxBytes: 1048576
  replicaLagMaxMessages: 10000
